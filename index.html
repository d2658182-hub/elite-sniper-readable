<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="authoring-tool" content="Adobe_Animate_CC - REFACTOR LISIBLE">
    <title>Elite Sniper - Version Lisible (Refactor)</title>
    <style>
        #animation_container, #load_img, #load_txt {
            position: absolute; margin: auto; left:0; right:0; top:0; bottom:0;
        }
        body { margin:0; background:#111; font-family:Arial,sans-serif; }
        #info {
            position: absolute; top:10px; left:10px; color:#fff; background:rgba(0,0,0,0.7);
            padding:10px; font-size:12px; max-width:400px; z-index:100;
        }
    </style>
    <!-- CreateJS original (inchangé) -->
    <script src="./createjs.js"></script>
    <!-- Assets original beautified (référence) OU assets.js original -->
    <script src="./assets.js"></script>
    <!-- GameAnalytics -->
    <script src="./GameAnalytics.min.js"></script>
    <script>
        // Analytics stub si bloqué
        if(typeof GameAnalytics==="undefined") window.GameAnalytics = function(){};
        // h5api stub CrazyGames (pour test local sans pub)
        window.h5api = window.h5api || {
            canPlayAd: cb=> cb({canPlayAd:false, remain:0}),
            playAd: cb=> cb&&cb({code:0}),
            share: ()=> console.log("share stub"),
            showRanking: ()=> console.log("rank stub"),
            submitRanking: (s,cb)=> cb&&cb({code:1e4}),
            login: cb=> cb&&cb({}),
            canPlayAd: cb=> cb({canPlayAd:false})
        };
    </script>
</head>
<body>
    <div id="info">
        <b>Elite Sniper - VERSION LISIBLE</b><br>
        Moteur: Adobe Animate CC + CreateJS<br>
        Refactor: 6 modules ESM dans <code>js/</code><br>
        Original beautified: <code>assets.original.beautified.js</code> (35k lignes)<br>
        <small>Canvas 1280x720 @62fps | Ouvrir console (F12) pour logs</small>
    </div>

    <div id="container_background" tabindex="0" style="background:#ffffff; width:1280px; height:720px"></div>
    <div id="animation_container" style="background:#ffffff; overflow:visible">
        <canvas id="canvas" width="1280" height="720" style="position:absolute; display:none; background:#ffffff;"></canvas>
    </div>
    <div id="load_img" style="width:100px; height:100px;"><img src="./loading.png"></div>
    <div id="load_txt"><p></p></div>

    <!-- Script original Animate (gardé pour compat stage) -->
    <script>
        var canvas, stage, exportRoot, anim_container, fnStartAnimation, loader, loading_img, loader_txt;
        function init() {
            canvas = document.getElementById("canvas");
            anim_container = document.getElementById("animation_container");
            var comp = AdobeAn.getComposition("28B497B60847774D94E996E7A9D3CF54");
            var lib = comp.getLibrary();
            loader = new createjs.LoadQueue(false);
            loader.addEventListener("fileload", function(evt){ handleFileLoad(evt, comp) });
            loader.addEventListener("complete", function(evt){ handleComplete(evt, comp) });
            loader.loadManifest(lib.properties.manifest);
        }
        function handleFileLoad(evt, comp) {
            var images = comp.getImages();
            if (evt && evt.item.type=="image") images[evt.item.id]=evt.result;
            var p=Math.floor(loader._numItemsLoaded/loader._numItems*100);
            loading_img=document.getElementById("load_img");
            loading_img.style.top="-50px";
            loader_txt=document.getElementById("load_txt");
            loader_txt.style.font="normal bold 13px arial";
            loader_txt.style.textAlign="center";
            loader_txt.innerHTML=p+"%";
            loader_txt.style.top=document.documentElement.clientHeight/2+30+"px";
        }
        function handleComplete(evt, comp){
            var lib=comp.getLibrary(); var ss=comp.getSpriteSheet(); var queue=evt.target;
            var ssMetadata=lib.ssMetadata;
            for(let i=0;i<ssMetadata.length;i++){
                ss[ssMetadata[i].name]= new createjs.SpriteSheet({"images":[queue.getResult(ssMetadata[i].name)], "frames":ssMetadata[i].frames})
            }
            anim_container.style.backgroundColor='#ffffff';
            loading_img.style.display='none'; loader_txt.style.display='none';
            canvas.style.display='block';
            exportRoot=new lib.assets(); stage=new lib.Stage(canvas);
            window.stage=stage; window.exportRoot=exportRoot;
            fnStartAnimation=function(){
                stage.addChild(exportRoot);
                createjs.Ticker.setFPS(lib.properties.fps);
                createjs.Ticker.addEventListener("tick", stage);
                // Lance le refactor lisible après 100ms
                setTimeout(()=>{
                    import('./js/main.js').then(()=> console.log("Refactor lisible chargé (main.js) - tick humain branché"));
                    document.getElementById("info").style.display="none";
                },100);
            }
            function makeResponsive(isResp, respDim, isScale, scaleType){
                var lastW,lastH,lastS=1;
                window.addEventListener('resize', resizeCanvas); resizeCanvas();
                function resizeCanvas(){
                    var w=lib.properties.width, h=lib.properties.height;
                    var iw=window.innerWidth, ih=window.innerHeight;
                    var pRatio=window.devicePixelRatio||1, xRatio=iw/w, yRatio=ih/h, sRatio=1;
                    if(isResp){
                        if((respDim=='width'&&lastW==iw)||(respDim=='height'&&lastH==ih)) sRatio=lastS;
                        else if(!isScale){ if(iw<w||ih<h) sRatio=Math.min(xRatio,yRatio); }
                        else if(scaleType==1) sRatio=Math.min(xRatio,yRatio);
                        else if(scaleType==2) sRatio=Math.max(xRatio,yRatio);
                    }
                    canvas.width=w*pRatio*sRatio; canvas.height=h*pRatio*sRatio;
                    canvas.style.width=anim_container.style.width=w*sRatio+'px';
                    canvas.style.height=anim_container.style.height=h*sRatio+'px';
                    document.getElementById("container_background").style.width=iw+'px';
                    document.getElementById("container_background").style.height=ih+'px';
                    stage.scaleX=pRatio*sRatio; stage.scaleY=pRatio*sRatio;
                    lastW=iw; lastH=ih; lastS=sRatio; stage.tickOnUpdate=false; stage.update(); stage.tickOnUpdate=true;
                }
            }
            makeResponsive(true,'both',true,1);
            AdobeAn.compositionLoaded(lib.properties.id);
            fnStartAnimation();
        }
    </script>
</body>
<body onload="init();" style="margin:0"></body>
</html>
